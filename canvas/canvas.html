    <script>
    </script>

</head>

<body>
    <div id="root"></div> <!-- Контейнер для рендеринга Konva -->

    <script>
        let centerX;
        let centerY;
        class Field {
            constructor(width, height, container) {
                this.stage = new Konva.Stage({ container, width, height });
                centerX = this.stage.width() / 2;
                centerY = this.stage.height() / 2;
                this.layer = new Konva.Layer();
                this.stage.add(this.layer);
                this.cells = {}; // Храним все клетки, чтобы не пересоздавать формулы
                this.renderElement = document.createElement("div"); // Временный рендеринг формул
                // this.renderElement.style.visibility = "hidden";
                document.body.appendChild(this.renderElement);
            }

            setZoom(scale) {
                this.stage.scale({ x: scale, y: scale });
                this.stage.batchDraw();
            }

            getZoom() {
                return this.stage.scaleX();  // X и Y одинаковые
            }

            fitToContent(padding = 100) {
    const keys = Object.keys(this.cells);
    if (keys.length === 0) return;

    let minX = Infinity, minY = Infinity;
    let maxX = -Infinity, maxY = -Infinity;

    keys.forEach(key => {
        const group = this.cells[key];
        const bbox = group.getClientRect({ relativeTo: this.layer });
        minX = Math.min(minX, bbox.x);
        minY = Math.min(minY, bbox.y);
        maxX = Math.max(maxX, bbox.x + bbox.width);
        maxY = Math.max(maxY, bbox.y + bbox.height);
    });

    const contentWidth = maxX - minX;
    const contentHeight = maxY - minY;

    const availableWidth = window.innerWidth - 2 * padding;
    const availableHeight = window.innerHeight - 2 * padding;

    // Находим минимальный масштаб, чтобы влезло всё
    const scale = Math.min(
        availableWidth / contentWidth,
        availableHeight / contentHeight
    );

    this.stage.scale({ x: scale, y: scale });

    // Центрируем сцену
    const offsetX = minX + contentWidth / 2;
    const offsetY = minY + contentHeight / 2;

    const stageX = window.innerWidth / 2 - offsetX * scale;
    const stageY = window.innerHeight / 2 - offsetY * scale;

    this.stage.position({ x: stageX, y: stageY });

    this.stage.batchDraw();
}

            computeLT(x, y) {
                const hexSize = 130;
                const spacing = 20;

                // Constants used in the transformation
                const factor1 = Math.sqrt(3) * hexSize + spacing;
                const factor2 = 3 * hexSize + Math.sqrt(3) * spacing;

                // Compute L - T and L + T
                let L_minus_T = (2 * (x - centerX)) / factor1;
                let L_plus_T = (2 * (centerY - y)) / factor2;

                // Compute L and T
                let L = (L_minus_T + L_plus_T) / 2;
                let T = (L_plus_T - L_minus_T) / 2;

                // Round to the nearest integer
                L = Math.round(L);
                T = Math.round(T);

                // Проверяем, есть ли сота в этих координатах
                const key = `${L},${T}`;
                const cellGroup = this.cells[key] || null;

                let group_name = null;
                if (cellGroup != null) {
                    const cell = cellGroup.getChildren()[0];
                    group_name = cell.attrs.group_name;
                    
                    // Дополнительная проверка: убеждаемся, что клик действительно попал в эту соту
                    const cellX = centerX + ((L - T) * (Math.sqrt(3) * hexSize + spacing)) / 2;
                    const cellY = centerY - ((L + T) * (3 * hexSize + Math.sqrt(3) * spacing)) / 2;
                    
                    // Проверяем расстояние от центра соты
                    const distance = Math.sqrt((x - cellX) ** 2 + (y - cellY) ** 2);
                    
                    // Если клик слишком далеко от центра соты, возвращаем null
                    if (distance > hexSize * 1.2) {
                        group_name = null;
                    }
                }

                return { L, T, group_name };
            }

            /**
             * Создаёт или изменяет существующую соту.
             * @param {number} L - Координата L
             * @param {number} T - Координата T
             * @param {string} name - Название блока
             * @param {string} symbol - Условное обозначение
             * @param {string} value_c - Размерность в СИ
             * @param {string} group_name - Название системной группы
             * @param {string} color - Цвет соты
             * @param {boolean} activated - Выделена ли сота
             */
            createCell(L, T, name, symbol, value_c, group_name, color = "#73ecfa", activated = false) {
                const x = centerX + ((L - T) * (Math.sqrt(3) * 130 + 20)) / 2;
                const y = centerY - ((L + T) * (3 * 130 + Math.sqrt(3) * 20)) / 2;
                const points = [];

                for (let i = 0; i <= 6; ++i) {
                    const angle = (2 * Math.PI * i) / 6;
                    points.push(x + 130 * Math.sin(angle), y - 130 * Math.cos(angle));
                }

                const cellKey = `${L},${T}`;
                let cellGroup = this.cells[cellKey];

                if (cellGroup) {
                    // Просто обновляем свойства, НО НЕ инвертируем активность
                    const cell = cellGroup.getChildren()[0];

                    // Если явно передан activated — используем его
                    const newActivated = activated ?? false;

                    cell.stroke(newActivated ? "red" : "black");
                    cell.strokeWidth(newActivated ? 6 : 2);
                    cell.dash(newActivated ? [8, 10] : null);
                    cell.attrs.activated = newActivated;
                    cell.attrs.group_name = group_name;

                    this.layer.draw();
                    return;
                }

                // Создаём новую соту
                const cell = new Konva.Line({
                    points,
                    fill: color,
                    stroke: activated ? "red" : "black",
                    strokeWidth: activated ? 6 : 2,
                    closed: true,
                    dash: activated ? [8, 10] : null,
                    activated,
                    group_name,
                });

                cellGroup = new Konva.Group();
                cellGroup.add(cell);
                this.layer.add(cellGroup);

                const clickHandler = () => {
                    // Проверяем блокировку операций с полем
                    if (window.fieldOperationsBlocked) {
                        console.log("🛡️ Field operations blocked");
                        return;
                    }
                    
                    if (window.suppressNextClick) {
                        window.suppressNextClick = false;
                        console.log("🛡️ Click suppressed");
                        return;
                    }

                    this.createCell(L, T, name, symbol, value_c, group_name, color, !cell.attrs.activated);
                    if (window.pyqtObject) {
                        window.pyqtObject.onCellSelected(L, T, group_name);
                    }
                }

                cell.on("click", clickHandler);

                // **Добавляем обработку ПКМ (правой кнопки мыши)**
                cell.on("contextmenu", (e) => {
                    e.evt.preventDefault(); // Отключаем ст��ндартное контекстное меню

                    // Проверяем блокировку операций с полем
                    if (window.fieldOperationsBlocked) {
                        console.log("🛡️ Field operations blocked");
                        return;
                    }

                    const x = e.evt.clientX + window.scrollX;
                    const y = e.evt.clientY + window.scrollY;

                    console.log(`ПКМ по соте L=${L}, T=${T}, позиция: x=${x}, y=${y}`);

                    if (window.jsBridge && window.jsBridge.show_context_menu) {
                        window.jsBridge.show_context_menu(L, T, group_name, x, y); // Отправляем данные в PyQt
                    } else {
                        console.error("JS Bridge объект не найден!");
                    }
                });



                // 🔹 Добавление формулы внутри соты
                this.createFormula(x - 105, y - 60, cellGroup, clickHandler, name, symbol, value_c);

                this.cells[cellKey] = cellGroup;
                this.layer.draw();
            }

            /**
             * Создаёт и добавляет формулу в соту.
             * @param {number} x - Координата x
             * @param {number} y - Координата y
             * @param {Konva.Group} parentGroup - Группа соты
             * @param {Function} clickHandler - Обработчик клика
             */
            createFormula(x, y, parentGroup, clickHandler, name, symbol, value_c) {
                this.renderElement.innerHTML = "";

                // Разделяем название на слова, если оно длинное (> 1 слова)
                let nameParts = name.split(" ");
                let formattedName = nameParts.length > 1 ? nameParts.join(" \\\\ ") : nameParts[0];

                // Создаем полную строку формулы с нужными разделителями
                let katexString = `${formattedName}, \\ ${symbol} \\\\ ${value_c}`;

                // Создаём временный div, но НЕ добавляем в body
                const tempEl = document.createElement("div");
                tempEl.style.width = "100px";
                tempEl.style.whiteSpace = "normal";
                tempEl.style.overflowWrap = "break-word";
                tempEl.style.fontSize = "10px";
                tempEl.style.display = "inline-block";
                tempEl.style.position = "absolute"; // Не влияет на макет
                tempEl.style.left = "-9999px"; // Прячем вне экрана
                document.body.appendChild(tempEl);

                katex.render(katexString, tempEl, {
                    throwOnError: false,
                    displayMode: true, // Включает блочный режим
                    output: "html"
                });

                html2canvas(tempEl, { backgroundColor: "rgba(0,0,0,0)" })
                    .then((canvas) => {
                        document.body.removeChild(tempEl);

                        const imgObj = new Image();
                        imgObj.onload = () => {
                            const image = new Konva.Image({ x, y, image: imgObj });
                            image.on("click", clickHandler);
                            parentGroup.add(image);
                            this.layer.draw();
                        };

                        imgObj.src = canvas.toDataURL("image/png");
                    })
                    .catch(console.error);
            }

            updateCell(L, T, name, symbol, value_c, group_name, color) {
                const cellKey = `${L},${T}`;
                const oldGroup = this.cells[cellKey];

                if (!oldGroup) {
                    console.error(`❌ Сота L=${L}, T=${T} не найдена`);
                    return;
                }

                // 🔹 Удаляем старую группу
                oldGroup.destroy();
                delete this.cells[cellKey];

                // 🔹 Перерисовка слоя
                this.layer.draw();

                // 🔹 Создаём новую с теми же координатами
                this.createCell(L, T, name, symbol, value_c, group_name, color, false);
        }

            /**
             * Удаляет соту с холста.
             * @param {number} L - Координата L
             * @param {number} T - Координата T
             */
            removeCell(L, T) {
                const cellKey = `${L},${T}`;
                let cellGroup = this.cells[cellKey];

                if (!cellGroup) {
                    console.error(`❌ Нельзя удалить соту, так как её нет: L=${L}, T=${T}`);
                    return;
                }

                cellGroup.destroy(); // Удаляем из сцены
                delete this.cells[cellKey]; // Удаляем из мапы

                this.layer.draw();
                console.log(`🗑 Сота удалена: L=${L}, T=${T}`);
            }


            drawParallelogram(points, color) {
                // Удалить старый полигон если есть
                if (field.parallelogram) {
                    field.parallelogram.destroy();
                    field.parallelogram = null;
                }

                // Преобразуем LT в координаты (пример, зависит от твоей формулы computeLT → x, y)
                const screenPoints = points.map(({ L, T }) => {
                    const x = centerX + ((L - T) * (Math.sqrt(3) * 130 + 20)) / 2;
                    const y = centerY - ((L + T) * (3 * 130 + Math.sqrt(3) * 20)) / 2;
                    return [x, y];
                });

                const flatPoints = screenPoints.flat(); // Konva требует [x1, y1, x2, y2, ...]

                const polygon = new Konva.Line({
                    points: flatPoints,
                    closed: true,
                    stroke: color ?? 'red',
                    strokeWidth: 6,
                    // dash: [6, 4],
                });

                field.layer.add(polygon);
                field.parallelogram = polygon;
                field.layer.draw();
            }

            clearParallelogram() {
                if (!this.parallelogram) {
                    return;
                }

                this.parallelogram.destroy();
                this.parallelogram = null;
                this.layer.draw();
                console.log("🧹 Параллелограмм удалён");
            }

            clearAll() {
                this.layer.destroyChildren();
                this.cells = {};
                this.parallelogram = null;
                this.layer.draw();
            }
        }

        field = new Field(window.innerWidth, window.innerHeight, "root");
        window.suppressNextClick = false;

     function ensureFieldExists(callback) {
      if (window.field) {
        callback();
      } else {
        setTimeout(() => ensureFieldExists(callback), 100);
      }
    }


        window.addEventListener("resize", () => {
            field.stage.width(window.innerWidth);
            field.stage.height(window.innerHeight);
            field.stage.batchDraw();
        });

        function exportCanvasImage() {
            const container = document.getElementById("root");
            html2canvas(container, {
                backgroundColor: "#ffffff", // лучшее качество и белый фон
                scale: 2 // увеличить разрешение
            }).then(canvas => {
                const dataURL = canvas.toDataURL("image/png");
                if (window.pyqtObject && window.pyqtObject.save_canvas_image) {
                    window.pyqtObject.save_canvas_image(dataURL);
                }
            });
        }

        function exportVisibleCanvasImage() {
            const container = document.getElementById("root");

            html2canvas(container, {
                backgroundColor: null,
                useCORS: true,
                windowWidth: window.innerWidth,
                windowHeight: window.innerHeight,
                scrollX: 0,
                scrollY: 0,
                x: window.scrollX,
                y: window.scrollY,
                width: window.innerWidth,
                height: window.innerHeight,
            }).then(canvas => {
                const dataURL = canvas.toDataURL("image/png");
                if (window.pyqtObject && window.pyqtObject.save_canvas_image) {
                    window.pyqtObject.save_canvas_image(dataURL);
                }
            });
        }
    </script>
