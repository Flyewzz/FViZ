<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Grid</title>

    <!-- Подключение KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/qwebchannel@5.9.0/qwebchannel.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    if (typeof qt !== "undefined") {
        new QWebChannel(qt.webChannelTransport, function(channel) {
            window.pyqtObject = channel.objects.backend;
        });
    } else {
        console.error("QWebChannel не найден! Проверь, что qwebchannel.js загружен.");
    }
});
</script>

    <!-- Другие библиотеки -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/konva/7.2.5/konva.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
    </style>
</head>

<body>
    <h2>Физическая система</h2>
    <div id="root"></div> <!-- Контейнер для рендеринга Konva -->

    <script>
        class Field {
            constructor(width, height, container) {
                this.stage = new Konva.Stage({ container, width, height });
                this.layer = new Konva.Layer();
                this.stage.add(this.layer);
                this.cells = {}; // Храним все клетки, чтобы не пересоздавать формулы
                this.renderElement = document.createElement("div"); // Временный рендеринг формул
                // this.renderElement.style.visibility = "hidden";
                document.body.appendChild(this.renderElement);
            }

            /**
             * Создаёт или изменяет существующую соту.
             * @param {number} L - Координата L
             * @param {number} T - Координата T
             * @param {string} color - Цвет соты
             * @param {boolean} activated - Выделена ли сота
             */
            createCell(L, T, color = "#73ecfa", activated = false) {
                const x = 500 + ((L - T) * (Math.sqrt(3) * 130 + 20)) / 2;
                const y = 500 - ((L + T) * (3 * 130 + Math.sqrt(3) * 20)) / 2;
                const points = [];

                for (let i = 0; i <= 6; ++i) {
                    const angle = (2 * Math.PI * i) / 6;
                    points.push(x + 130 * Math.sin(angle), y - 130 * Math.cos(angle));
                }

                const cellKey = `${L},${T}`;
                let cellGroup = this.cells[cellKey];

                if (cellGroup) {
                    // Если сота уже существует, просто меняем её состояние
                    const cell = cellGroup.getChildren()[0];
                    const newActivated = !cell.attrs.activated;

                    cell.stroke(newActivated ? "red" : "black");
                    cell.strokeWidth(newActivated ? 6 : 2);
                    cell.dash(newActivated ? [8, 10] : null);
                    cell.attrs.activated = newActivated;
                    this.layer.draw();
                    return;
                }

                // Создаём новую соту
                const cell = new Konva.Line({
                    points,
                    fill: color,
                    stroke: activated ? "red" : "black",
                    strokeWidth: activated ? 6 : 2,
                    closed: true,
                    dash: activated ? [8, 10] : null,
                    activated,
                });

                cellGroup = new Konva.Group();
                cellGroup.add(cell);
                this.layer.add(cellGroup);

                const clickHandler = () => this.createCell(L, T, color, !cell.attrs.activated);

                cell.on("click", clickHandler);

                // Добавление формулы внутри соты
                this.createFormula(x - 105, y - 60, cellGroup, clickHandler, 'Плотность', 'кг/м^3', 'F^2I^{-2}R');

                this.cells[cellKey] = cellGroup;
                this.layer.draw();
            }

            /**
             * Создаёт и добавляет формулу в соту.
             * @param {number} x - Координата x
             * @param {number} y - Координата y
             * @param {Konva.Group} parentGroup - Группа соты
             * @param {Function} clickHandler - Обработчик клика
             */
            createFormula(x, y, parentGroup, clickHandler, name = "Ускорение свободное", unit = "v^2", formula = "L^2T^2 \\vec{F} T^{-1}") {
                this.renderElement.innerHTML = "";

                // Разделяем название на слова, если оно длинное (> 1 слова)
                 let nameParts = name.split(" ");
                let formattedName = nameParts.length > 1 ? nameParts.join(" \\\\ ") : nameParts[0];

                // Создаем полную строку формулы с нужными разделителями
                let katexString = `${formattedName}, \\ ${unit} \\\\ ${formula}`;


                // Устанавливаем ограничение по ширине (например, 100px) для автоматического переноса
                this.renderElement.style.width = "100px";
                this.renderElement.style.whiteSpace = "normal";
                this.renderElement.style.overflowWrap = "break-word";
                this.renderElement.style.display = "inline-block"; // Позволяет измерять размер
                this.renderElement.style.fontSize = "11px"; // Начальный размер шрифта

                katex.render(katexString, this.renderElement, {
                    throwOnError: false,
                    displayMode: true // Включает блочный режим
                });

                html2canvas(this.renderElement, { backgroundColor: "rgba(0,0,0,0)" })
                    .then((canvas) => {
                        const imgObj = new Image();
                        imgObj.src = canvas.toDataURL("image/png");

                        const image = new Konva.Image({ x, y, image: imgObj });

                        image.on("click", clickHandler); // Клик на формуле обрабатывает соту
                        parentGroup.add(image);
                        this.layer.draw();
                    })
                    .catch(console.error);
            }
        }

        const field = new Field(1500, 1100, "root");

        // Генерация сетки сот
        for (let i = -2; i <= 2; ++i) {
            for (let j = -2; j <= 2; ++j) {
                field.createCell(i, j, "#73ecfa");
            }
        }
    </script>
</body>
</html>
