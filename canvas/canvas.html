<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Загрузим React. -->
    <!-- Примечание: при деплое на продакшен замените «development.js» на «production.min.js». -->

    <script src="katex/katex.min.js" type="text/javascript"></script>
    <link href="katex/katex.min.css" rel="stylesheet" type="text/css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script
      src="https://unpkg.com/react@17/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/konva/7.2.5/konva.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <div id="render"></div>
    <div id="root"></div>
    <!-- Загрузим наш React-компонент. -->
    <!-- <script src="canvas.js"></script> -->
    <script type="text/babel">
      class Field {
        kItemSizeScale = 1;
        r = 130 * this.kItemSizeScale;
        N = 6;
        space = 20;
        startCellPositionX = 500;
        startCellPositionY = 500;
        renderElement = document.getElementById("render");

        constructor(w, h, container) {
          this.stage = new Konva.Stage({
            container: container, // id of container <div>
            width: w,
            height: h,
          });
          this.layer = new Konva.Layer(); // then create layer
          // add the layer to the stage
          this.stage.add(this.layer);

          this.cells = {}; // Храним все клетки, чтобы не пересоздавать формулы
        }

        createCell(L, T, color, activated = false) {
    let get_x = (L, T) =>
      this.startCellPositionX +
      ((L - T) * (Math.sqrt(3) * this.r + this.space)) / 2;

    let get_y = (L, T) =>
      this.startCellPositionY -
      ((L + T) * (3 * this.r + Math.sqrt(3) * this.space)) / 2;

    let x = get_x(L, T);
    let y = get_y(L, T);
    let points = [];

    for (let i = 0; i <= this.N; ++i) {
      let angle = (2 * Math.PI * i) / this.N;
      points.push(
        x + this.r * Math.sin(angle),
        y - this.r * Math.cos(angle)
      );
    }

    let cellGroup = this.cells[`${L},${T}`];

    if (cellGroup) {
      // Если сота уже существует, просто меняем её состояние
      let cell = cellGroup.getChildren()[0]; // Получаем соту (первый элемент в группе)
      let newActivated = !cell.attrs.activated; // Меняем состояние

      cell.stroke(newActivated ? "red" : "black");
      cell.strokeWidth(newActivated ? 6 : 2);
      cell.dash(newActivated ? [8, 10] : null);
      cell.attrs.activated = newActivated; // Запоминаем состояние

      this.layer.draw();
      return;
    }

    // Создаём новую соту
    let cell = new Konva.Line({
      points: points,
      fill: color,
      stroke: activated ? "red" : "black",
      strokeWidth: activated ? 6 : 2,
      closed: true,
      dash: activated ? [8, 10] : null,
      activated: activated, // Запоминаем состояние
    });

    cellGroup = new Konva.Group();
    cellGroup.add(cell);
    this.layer.add(cellGroup);

    let eventFunction = () => {
      console.log("Clicked on L: " + L + ", T: " + T);
      this.createCell(L, T, "#73ecfa", !cell.attrs.activated);
    };

    cell.on("click", eventFunction);

    // Рисуем формулу (но только один раз)
    this.createFormula(x - 105, y - 60, cellGroup, eventFunction);

    this.cells[`${L},${T}`] = cellGroup; // Запоминаем соту
    this.layer.draw();
  }
        createFormula(x, y, parentGroup, eventFunction) {
    this.renderElement.innerHTML = ""; // Очищаем перед рендерингом

    katex.render(
      "Скорость \\  v \\\\ L^2T^2 \\vec{F} T^{-1}",
      this.renderElement
    );

    html2canvas(this.renderElement, {
      backgroundColor: "rgba(0,0,0,0)",
    })
      .then((canvas) => {
        let imgObj = new Image();
        imgObj.src = canvas.toDataURL("image/png");

        let image = new Konva.Image({
          x: x,
          y: y,
          image: imgObj,
        });

        image.on("click", eventFunction); // Теперь клик на формуле обновляет соту
        parentGroup.add(image);
        this.layer.draw();
      })
      .catch((err) => console.log(err));
  }
      }
      //ReactDOM.render(<App />, document.getElementById("root"));

      let field = new Field(1500, 1100, "root");
      for (let i = -2; i <= 2; ++i) {
        for (let j = -2; j <= 2; ++j) {
          field.createCell(i, j, "#73ecfa");
        }
      }
    </script>
  </body>
</html>
