<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Grid</title>

    <!-- Подключение KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/qwebchannel@5.9.0/qwebchannel.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    if (typeof qt !== "undefined") {
        new QWebChannel(qt.webChannelTransport, function(channel) {
            window.pyqtObject = channel.objects.backend;
        });
    } else {
        console.error("QWebChannel не найден! Проверь, что qwebchannel.js загружен.");
    }
});
</script>

    <!-- Другие библиотеки -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/konva/7.2.5/konva.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
    </style>
</head>

<body>
    <h2>Физическая система</h2>
    <div id="root"></div> <!-- Контейнер для рендеринга Konva -->

    <script>
        let centerX;
        let centerY;

        function computeLT(x, y) {
            const hexSize = 130;
            const spacing = 20;

            // Constants used in the transformation
            const factor1 = Math.sqrt(3) * hexSize + spacing;
            const factor2 = 3 * hexSize + Math.sqrt(3) * spacing;

            // Compute L - T and L + T
            let L_minus_T = (2 * (x - centerX)) / factor1;
            let L_plus_T = (2 * (centerY - y)) / factor2;

            // Compute L and T
            let L = (L_minus_T + L_plus_T) / 2;
            let T = (L_plus_T - L_minus_T) / 2;

            // Round to the nearest integer
            L = Math.round(L);
            T = Math.round(T);

            return { L, T };
        }

        class Field {
            constructor(width, height, container) {
                this.stage = new Konva.Stage({ container, width, height });
                centerX = this.stage.width() / 2;
                centerY = this.stage.height() / 2;
                this.layer = new Konva.Layer();
                this.stage.add(this.layer);
                this.cells = {}; // Храним все клетки, чтобы не пересоздавать формулы
                this.renderElement = document.createElement("div"); // Временный рендеринг формул
                // this.renderElement.style.visibility = "hidden";
                document.body.appendChild(this.renderElement);
            }

            /**
             * Создаёт или изменяет существующую соту.
             * @param {number} L - Координата L
             * @param {number} T - Координата T
             * @param {string} name - Название блока
             * @param {string} symbol - Условное обозначение
             * @param {string} value_c - Размерность в СИ
             * @param {string} color - Цвет соты
             * @param {boolean} activated - Выделена ли сота
             */
            createCell(L, T, name, symbol, value_c, color = "#73ecfa", activated = false) {
                const x = centerX + ((L - T) * (Math.sqrt(3) * 130 + 20)) / 2;
                const y = centerY - ((L + T) * (3 * 130 + Math.sqrt(3) * 20)) / 2;
                const points = [];

                for (let i = 0; i <= 6; ++i) {
                    const angle = (2 * Math.PI * i) / 6;
                    points.push(x + 130 * Math.sin(angle), y - 130 * Math.cos(angle));
                }

                const cellKey = `${L},${T}`;
                let cellGroup = this.cells[cellKey];

                if (cellGroup) {
                    // Если сота уже существует, просто меняем её состояние
                    const cell = cellGroup.getChildren()[0];
                    const newActivated = !cell.attrs.activated;

                    cell.stroke(newActivated ? "red" : "black");
                    cell.strokeWidth(newActivated ? 6 : 2);
                    cell.dash(newActivated ? [8, 10] : null);
                    cell.attrs.activated = newActivated;
                    this.layer.draw();
                    return;
                }

                // Создаём новую соту
                const cell = new Konva.Line({
                    points,
                    fill: color,
                    stroke: activated ? "red" : "black",
                    strokeWidth: activated ? 6 : 2,
                    closed: true,
                    dash: activated ? [8, 10] : null,
                    activated,
                });

                cellGroup = new Konva.Group();
                cellGroup.add(cell);
                this.layer.add(cellGroup);

                const clickHandler = () => this.createCell(L, T, name, symbol, value_c, color, !cell.attrs.activated);

                cell.on("click", clickHandler);

                // **Добавляем обработку ПКМ (правой кнопки мыши)**
                cell.on("contextmenu", (e) => {
                    e.evt.preventDefault(); // Отключаем стандартное контекстное меню

                    const x = e.evt.clientX + window.scrollX;
                    const y = e.evt.clientY + window.scrollY;

                    console.log(`ПКМ по соте L=${L}, T=${T}, позиция: x=${x}, y=${y}`);

                    if (window.pyqtObject) {
                        window.pyqtObject.showContextMenu(L, T); // Отправляем данные в PyQt
                    } else {
                        console.error("PyQt объект не найден!");
                    }
                });

                // 🔹 Добавление формулы внутри соты
                this.createFormula(x - 105, y - 60, cellGroup, clickHandler, name, symbol, value_c);

                this.cells[cellKey] = cellGroup;
                this.layer.draw();
            }

            /**
             * Создаёт и добавляет формулу в соту.
             * @param {number} x - Координата x
             * @param {number} y - Координата y
             * @param {Konva.Group} parentGroup - Группа соты
             * @param {Function} clickHandler - Обработчик клика
             */
            createFormula(x, y, parentGroup, clickHandler, name, symbol, value_c) {
                this.renderElement.innerHTML = "";

                // Разделяем название на слова, если оно длинное (> 1 слова)
                let nameParts = name.split(" ");
                let formattedName = nameParts.length > 1 ? nameParts.join(" \\\\ ") : nameParts[0];

                // Создаем полную строку формулы с нужными разделителями
                let katexString = `${formattedName}, \\ ${symbol} \\\\ ${value_c}`;

                // Создаём временный div, но НЕ добавляем в body
                const tempEl = document.createElement("div");
                tempEl.style.width = "100px";
                tempEl.style.whiteSpace = "normal";
                tempEl.style.overflowWrap = "break-word";
                tempEl.style.fontSize = "10px";
                tempEl.style.display = "inline-block";
                tempEl.style.position = "absolute"; // Не влияет на макет
                tempEl.style.left = "-9999px"; // Прячем вне экрана
                document.body.appendChild(tempEl);

                katex.render(katexString, tempEl, {
                    throwOnError: false,
                    displayMode: true // Включает блочный режим
                });

                html2canvas(tempEl, { backgroundColor: "rgba(0,0,0,0)" })
                    .then((canvas) => {
                        document.body.removeChild(tempEl);

                        const imgObj = new Image();
                        imgObj.onload = () => {
                            const image = new Konva.Image({ x, y, image: imgObj });
                            image.on("click", clickHandler);
                            parentGroup.add(image);
                            this.layer.draw();
                        };

                        imgObj.src = canvas.toDataURL("image/png");
                    })
                    .catch(console.error);
            }

            updateCell(L, T, name, symbol, value_c, color) {
                const cellKey = `${L},${T}`;
                const oldGroup = this.cells[cellKey];

                if (!oldGroup) {
                    console.error(`❌ Сота L=${L}, T=${T} не найдена`);
                    return;
                }

                // 🔹 Удаляем старую группу
                oldGroup.destroy();
                delete this.cells[cellKey];

                // 🔹 Перерисовка слоя
                this.layer.draw();

                // 🔹 Создаём новую с теми же координатами
                this.createCell(L, T, name, symbol, value_c, color, false);
        }

            /**
             * Удаляет соту с холста.
             * @param {number} L - Координата L
             * @param {number} T - Координата T
             */
            removeCell(L, T) {
                const cellKey = `${L},${T}`;
                let cellGroup = this.cells[cellKey];

                if (!cellGroup) {
                    console.error(`❌ Нельзя удалить соту, так как её нет: L=${L}, T=${T}`);
                    return;
                }

                cellGroup.destroy(); // Удаляем из сцены
                delete this.cells[cellKey]; // Удаляем из мапы

                this.layer.draw();
                console.log(`🗑 Сота удалена: L=${L}, T=${T}`);
            }


        }

        field = new Field(2300, 2300, "root");

     function ensureFieldExists(callback) {
      if (window.field) {
        callback();
      } else {
        setTimeout(() => ensureFieldExists(callback), 100);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        window.pyqtObject = channel.objects.backend;

        ensureFieldExists(() => {
          console.log("✅ Вызов sendAllCellsToWebView из JS");
          if (window.pyqtObject.sendAllCellsToWebView) {
            window.pyqtObject.sendAllCellsToWebView();
          } else {
            console.error("❌ Метод sendAllCellsToWebView не найден в pyqtObject");
          }
        });
      });
    });
    </script>
</body>
</html>
